<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سازنده پرامپت</title>
    <style>
        :root {
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --accent: #10b981;
    --error: #ef4444;
    --input-bg: #111827;
    --textarea-bg: #0c1220;
    --button-bg: #273246;
    --button-hover-bg: #384a6a;
    --dropdown-bg: #2d3748;
    --dropdown-hover-bg: #3a4a63;
}

body {
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start; /* شروع از بالا */
    min-height: 100vh;
    padding: 20px;
    overflow-y: auto; /* فعال کردن اسکرول عمودی */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* فونت خواناتر */
}

.container {
    width: 100%;
    max-width: 1300px; /* کمی عریض‌تر */
    background: var(--card-bg);
    border-radius: 24px;
    display: grid;
    grid-template-columns: 400px 1fr; /* سایدبار کمی عریض‌تر */
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
    margin-top: 40px; /* فاصله از بالای صفحه */
}

.sidebar {
    padding: 30px;
    border-left: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    flex-direction: column;
    gap: 20px; /* فاصله کمتر بین آیتم‌ها */
    height: fit-content; /* ارتفاع محتوا */
    max-height: 85vh; /* محدود کردن ارتفاع برای جلوگیری از بیرون زدن */
    overflow-y: auto; /* فعال کردن اسکرول برای سایدبار در صورت نیاز */
}

.main-content {
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

h2, h3 {
    font-size: 1.5rem; /* کمی بزرگتر */
    margin-bottom: 15px; /* فاصله کمتر */
    display: flex;
    align-items: center;
    gap: 12px; /* فاصله بیشتر */
    color: var(--primary);
    font-weight: 600; /* وزن متوسط */
}
h3 {
    color: var(--accent); /* رنگ متفاوت برای زیرمجموعه‌ها */
    font-size: 1.3rem;
    margin-top: 25px; /* فاصله بیشتر از بالا */
}
h2 i, h3 i { /* آیکون‌های فونت Awesome */
    font-size: 1.3rem;
}

label {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 8px;
    display: block;
}

input[type="text"],
input[type="number"],
textarea {
    width: 100%;
    padding: 12px 15px;
    background-color: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
textarea {
    min-height: 180px; /* ارتفاع بیشتر برای تکست‌اریا */
    resize: vertical;
    line-height: 1.6; /* خطوط خواناتر */
}

input[type="text"]:focus,
input[type="number"]:focus,
textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
}

/* استایل چک‌باکس‌ها */
.checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}
.checkbox-group input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--primary); /* رنگ چک‌باکس */
}
.checkbox-group label {
    margin-bottom: 0; /* حذف مارجین پایین برای لیبل چک‌باکس */
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--text); /* رنگ متن چک‌باکس */
}

/* استایل دکمه‌ها */
button {
    padding: 12px 25px;
    background-color: var(--primary);
    color: var(--text);
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
button:hover {
    background-color: var(--primary-hover);
    transform: translateY(-2px);
}
button i {
    font-size: 1.1rem;
}

#copyPromptButton {
    background-color: var(--accent);
    margin-top: 15px;
}
#copyPromptButton:hover {
    background-color: #0e9b6a; /* رنگ کمی تیره‌تر برای هاور */
}

/* باکس نمایش پرامپت */
.prompt-box {
    background-color: var(--textarea-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 15px;
    font-size: 1rem;
    font-family: 'Courier New', Courier, monospace; /* فونت monospace برای کد */
    white-space: pre-wrap; /* حفظ فاصله‌ها و شکست خطوط */
    word-break: break-all; /* شکستن کلمات طولانی */
    max-height: 250px;
    overflow-y: auto;
    margin-top: 10px;
    direction: ltr; /* پرامپت معمولا لاتین است */
    text-align: left; /* متن چپ‌چین */
}

/* تنظیمات ریسپانسیو برای نمایشگرهای کوچکتر */
@media (max-width: 992px) {
    .container {
        grid-template-columns: 1fr; /* همه چیز در یک ستون */
        max-width: 600px;
    }
    .sidebar {
        border-left: none;
        border-bottom: 1px solid var(--border);
        max-height: fit-content;
        height: auto;
        overflow-y: visible;
    }
     h2 {
        font-size: 1.5rem;
     }
     h3 {
         font-size: 1.2rem;
     }
}

/* استایل کلی برای قسمت‌های ورودی */
.options-group, .checkbox-group {
    margin-bottom: 20px;
}

    </style>
    <!-- فونت آیکون (اختیاری، برای آیکون‌های بیشتر) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2><i class="fas fa-magic"></i> تنظیمات پیشرفته</h2>
            <div class="options-group">
                <label>زبان‌های مورد نظر برای پروژه:</label>
                <input type="text" id="languages" placeholder="مثال: Python, JavaScript, HTML">
            </div>
            <div class="options-group">
                <label>نام پروژه (اختیاری):</label>
                <input type="text" id="projectName" placeholder="نام پروژه شما">
            </div>
             <div class="options-group">
                <label>حجم کد (تعداد خط تقریبی، اختیاری):</label>
                <input type="number" id="codeSize" placeholder="مثال: 100">
            </div>

            <h3>ویژگی‌های کد:</h3>
            <div class="checkbox-group">
                <input type="checkbox" id="commenting">
                <label for="commenting">کامنت‌گذاری و تعریف کد</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="singleFile">
                <label for="singleFile">کل پروژه در ۱ فایل</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="deepThought">
                <label for="deepThought">فکر کردن عمیق قبل از دادن کد</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="qualityOverSize">
                <label for="qualityOverSize">اولویت کیفیت کد بر حجم</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="externalResources">
                <label for="externalResources">استفاده از منابع خارجی (کتابخانه)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="publicApis">
                <label for="publicApis">استفاده از API های عمومی</label>
            </div>
             <div class="checkbox-group">
                <input type="checkbox" id="responsive">
                <label for="responsive">ریسپانسیو بودن</label>
            </div>
            <!-- اضافه کردن سایر گزینه‌ها -->
        </aside>
        <main class="main-content">
            <h2><i class="fas fa-pen-nib"></i> توضیحات پروژه</h2>
            <textarea id="projectDescription" placeholder="توضیحات کامل پروژه خود را اینجا وارد کنید... هرچی ایده داری بگو..."></textarea>
            <button id="generatePromptButton">ساخت پرامپت <i class="fas fa-rocket"></i></button>
            <div id="promptOutputContainer" style="display: none;">
                <h3>پرامپت شما:</h3>
                <div id="promptOutput" class="prompt-box"></div>
                <button id="copyPromptButton">کپی پرامپت</button>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('generatePromptButton').addEventListener('click', () => {
    const languages = document.getElementById('languages').value;
    const projectName = document.getElementById('projectName').value;
    const codeSize = document.getElementById('codeSize').value;
    const projectDescription = document.getElementById('projectDescription').value;

    // گرفتن وضعیت چک‌باکس‌ها
    const commenting = document.getElementById('commenting').checked;
    const singleFile = document.getElementById('singleFile').checked;
    const deepThought = document.getElementById('deepThought').checked;
    const qualityOverSize = document.getElementById('qualityOverSize').checked;
    const externalResources = document.getElementById('externalResources').checked;
    const publicApis = document.getElementById('publicApis').checked;
    const responsive = document.getElementById('responsive').checked;

    let prompt = `یک پروژه با زبان‌های ${languages || 'نامشخص'} بساز.\n\n`;

    if (projectName) {
        prompt += `نام پروژه: ${projectName}\n`;
    }
    if (codeSize) {
        prompt += `حجم کد تقریبی: ${codeSize} خط\n`;
    }

    prompt += `\nتوضیحات پروژه: ${projectDescription}\n\n`;

    prompt += "ویژگی‌های مورد نیاز کد:\n";

    if (commenting) {
        prompt += "- کامنت‌گذاری کامل و تعریف شفاف کد\n";
    }
    if (singleFile) {
        prompt += "- کل پروژه در یک فایل واحد سازماندهی شود\n";
    } else {
        prompt += "- کدها به صورت ماژولار و گسترده نوشته شوند (در صورت عدم انتخاب گزینه 'کل پروژه در ۱ فایل')\n";
    }

    if (deepThought) {
        prompt += "- قبل از ارائه کد، تحلیل عمیق و جامعی از نیازمندی‌ها انجام شود\n";
    }
    if (qualityOverSize) {
        prompt += "- اولویت اصلی، کیفیت، خوانایی و بهینگی کد باشد، نه حجم آن\n";
    }
    if (externalResources) {
        prompt += "- در صورت نیاز، از کتابخانه‌ها و منابع خارجی معتبر استفاده شود\n";
    }
    if (publicApis) {
        prompt += "- در صورت امکان، از API های عمومی و در دسترس استفاده شود\n";
    }
    if (responsive) {
        prompt += "- رابط کاربری باید ریسپانسیو باشد و در دستگاه‌های مختلف به خوبی نمایش داده شود\n";
    } else {
         prompt += "- ریسپانسیو بودن رابط کاربری اولویت ندارد و کد فقط برای محیط دسکتاپ نوشته شود (در صورت عدم فعال‌سازی ریسپانسیو بودن)\n";
    }

    // اضافه کردن موارد بیشتر بر اساس نیاز
    prompt += "\nلطفاً کد کامل و کاربردی را ارائه دهید.";

    const promptOutputDiv = document.getElementById('promptOutput');
    promptOutputDiv.textContent = prompt;
    document.getElementById('promptOutputContainer').style.display = 'block';
});

document.getElementById('copyPromptButton').addEventListener('click', () => {
    const promptText = document.getElementById('promptOutput').textContent;
    navigator.clipboard.writeText(promptText).then(() => {
        alert('پرامپت کپی شد!');
    }).catch(err => {
        console.error('خطا در کپی کردن پرامپت: ', err);
        alert('متاسفانه امکان کپی کردن خودکار وجود نداشت. لطفا دستی پرامپت را کپی کنید.');
    });
});
    </script>
</body>
</html>
